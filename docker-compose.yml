services:
  dev:
    build:
      context: .
      target: development-dependencies-env
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules
    working_dir: /app
    command: sh -c "pnpm install --frozen-lockfile && pnpm run dev --host 0.0.0.0"
    environment:
      - NODE_ENV=development
      - CI=true

  prod:
    build:
      context: .
    image: skill-tracker:local
    ports:
      - "3000:3000"
    restart: unless-stopped
